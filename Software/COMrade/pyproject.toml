[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "comrade"
version = "0.1.0"
description = "MCP server + serial bridge for agentic control of an MS-DOS machine"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2", "pyserial-asyncio>=0.6"]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.23"]

[project.scripts]
comrade = "comrade.__main__:main"

[tool.setuptools]
packages = ["comrade"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
